server.port=${PORT:8080}

# MySQL 8 as default and ONLY runtime database
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/shadowvault?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true}
spring.datasource.driverClassName=com.mysql.cj.jdbc.Driver
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASS:}
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

# Upload limits (evidence max 200 KB)
spring.servlet.multipart.max-file-size=500KB
spring.servlet.multipart.max-request-size=1MB

# Security & Crypto configurations
shadowvault.jwt.secret=${JWT_SECRET:4f7b2c9e8d1a5f0e3c6a9b2d5f8e1c4b7a0d3f6e9c2b5a8d1e4f7a0c3b6e9d28}
shadowvault.jwt.expiration-ms=86400000
# 32-byte AES key for victim identity encryption
shadowvault.identity.aes-key=4d7a8c1e2b5f6a9e3d0c7f1a8e2b4d6a4d7a8c1e2b5f6a9e3d0c7f1a8e2b4d6a
shadowvault.authority.access-code=${AUTHORITY_ACCESS_CODE:AUTH-2026}

# Paths for persisted RSA authority key pair and stego PNG files
shadowvault.storage.path=${DATA_DIR:./data}/storage
shadowvault.keys.path=${DATA_DIR:./data}/keys
